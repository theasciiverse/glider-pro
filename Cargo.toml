[package]
name = "glider-pro"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Glider PRO (John Calhoun, 1994) in the terminal: the paper glider through a house of hundreds of rooms, for the Asciiverse catalog"
license = "GPL-2.0-or-later"
publish = false

[[bin]]
name = "glider-pro"
path = "src/main.rs"

[dependencies]
miniz_oxide = "0.8"
ratatui = "0.30"
log = "0.4"
env_logger = "0.11"
rodio = { version = "0.22", default-features = false, features = ["playback"] }
gilrs = { version = "0.11", optional = true, default-features = false, features = ["xinput"] }

[build-dependencies]
miniz_oxide = "0.8"

[features]
default = ["gamepad"]
gamepad = ["dep:gilrs"]

[profile.release]
debug = 1

# the build script decodes 50 MB of BinHex and DeRez text
[profile.release.build-override]
opt-level = 3

[profile.dev.build-override]
opt-level = 3
